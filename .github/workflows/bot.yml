name: Bot Vinted

# Le passage est lancé toutes les 5 minutes par cron-job.org (appel « workflow_dispatch »).
# La planification GitHub ci-dessous n'est qu'un filet de sécurité : GitHub la retarde souvent de plusieurs heures.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: bot-vinted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la mémoire du bot
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Passage du bot
        timeout-minutes: 8
        continue-on-error: true
        env:
          NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
        run: python3 vinted_bot.py --une-fois

      - name: Sauver la mémoire du bot
        if: always() && hashFiles('etat.json') != ''
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
